<!DOCTYPE html>
<html>

<head></head>

<body>
    <form action="">
        <fieldset>
            <legend>Data diri</legend>
            <table width="460">
                <tr>
                    <td>Nama:</td>
                    <td><input type="text" name="email"></td>
                </tr>
                <tr>
                    <td>Tempat Lahir</td>
                    <td><input type="text" name="subject"></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir:</td>
                    <td><input type="text" name="subject"></td>
                </tr>
                <tr>
                    <td>Jenis Kelamin:</td>
                    <td><input type="radio" name="jenis_kelamin" value="Laki-Laki"> Laki-Laki
                        <input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan
                    </td>
                </tr>
                <tr>
                    <td>Agama:</td>
                    <td><select name="" id="">
                            <optgroup label="Agama">
                                <option value="islam">Islam</option>
                                <option value="kristen">Krister</option>
                                <option value="buda">Buda</option>
                                <option value="hindu">Hindu</option>
                            </optgroup>
                        </select></td>
                </tr>
                <tr>
                    <td>Alamat:</td>
                    <td><textarea name="text" id="alamat" rows="4" cols="40"></textarea></td>
                </tr>
                <tr>
                    <td>No Telpon:</td>
                    <td><input type="text" name="email"></td>
                </tr>
                <tr>
                    <td>No Hp</td>
                    <td><input type="text" name="subject"></td>
                </tr>
                <tr>
                    <td>Hobi:</td>
                    <td>
                        <input type="checkbox" name="Memmbaca" value="memeba">Membaca
                        <input type="checkbox" name="Olahraga" value="olahraga">Olahraga 
                        <input type="checkbox" name="Music" value="music">Music 
                        <input type="checkbox" name="Game" value="game">Game 
                    </td>
                </tr>
            </table>
        </fieldset>
        <fieldset>
            <legend>Riwayat Pendidikan</legend>
            <table width="5"></table>
            <tr>
                <td>S3:</td>
                <td><input type="text" name="s3"></td>
            </tr>
            <tr>
                <td>S2:</td>
                <td><input type="text" name="s2"></td>
            </tr>
            <tr>
                <td>S1:</td>
                <td><input type="text" name="s1"></td>
            </tr>
            <tr>
                <td>D3:</td>
                <td><input type="text" name="d3"></td>
            </tr>
            <tr>
                <td>SMA:</td>
                <td><input type="text" name="sma"></td>
            </tr>
            <tr>
                <td>SMS:</td>
                <td><input type="text" name="smp"></td>
            </tr>
            <tr>
                <td>SD:</td>
                <td><input type="text" name="sd"></td>
            </tr>
        </fieldset>
        <br>
        <input type="submit" name="Simpan" value="Simpan">

</html>
